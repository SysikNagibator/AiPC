name: pypi

# Публикация aipc-sysik на PyPI при пуше тега v*.
# Требуется один раз настроить Trusted Publishing на pypi.org:
#   аккаунт → Publishing → Add a new pending publisher:
#   owner SysikNagibator, project aipc-sysik, workflow pypi.yml.
# Токены не нужны. Версия берётся из pyproject.toml (совпадает с тегом).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC для Trusted Publishing

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
