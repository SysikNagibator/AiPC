name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.13"]
        exclude:
          # экономим минуты: macOS достаточно одной версии
          - os: macos-latest
            python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q aipc tools
      - run: python tools/gen_tools_table.py --check
      - run: python -m pytest tests -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check aipc tests tools --select E9,F --ignore E501 || true
      - run: ruff format --check aipc tests tools || true
