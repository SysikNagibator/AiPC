name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # release artifacts
  id-token: write # SLSA provenance (OIDC)
  attestations: write # persist SLSA attestation

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            pattern: "AiPC_Win_*.exe"
          - os: macos-latest
            pattern: "AiPC_macOS_*"
          - os: ubuntu-latest
            pattern: "AiPC_Linux_*"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q aipc tools
      - run: python -m pytest tests -q
      - run: python tools/gen_tools_table.py --check
      - name: Build binary
        run: python tools/build_all.py
      - name: Rename sums per OS
        shell: bash
        run: mv dist/SHA256SUMS.txt "dist/SHA256SUMS-${{ matrix.os }}.txt"
      - name: SLSA provenance (binary + sums)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/${{ matrix.pattern }}
            dist/SHA256SUMS-${{ matrix.os }}.txt
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aipc-${{ matrix.os }}
          path: |
            dist/${{ matrix.pattern }}
            dist/SHA256SUMS-${{ matrix.os }}.txt

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-all/*
          generate_release_notes: true
